[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostfixture"
version = "0.1.0"
description = "Minimal repro project generator for GhostSlice: materialises a bundle as a small standalone tree, flagged secrets excluded"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Ghost Developer Studio" }]
keywords = ["llm", "context", "ghostslice", "fixture", "repro", "agents"]
dependencies = []

[project.scripts]
ghostfixture = "ghostfixture.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
